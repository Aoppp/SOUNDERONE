<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SounderOne Agent Lab</title>
    <link rel="stylesheet" href="/static/tester.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">S1</div>
          <div>
            <p class="eyebrow">SOUNDERONE</p>
            <h1>Agent Lab</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="healthBadge" class="health-badge is-checking">
            <span class="status-dot"></span>
            <span id="healthText">正在检查服务</span>
          </span>
          <button id="newConversationButton" class="secondary-button" type="button">
            新建会话
          </button>
        </div>
      </header>

      <section class="workspace">
        <aside class="control-panel">
          <div class="panel-section intro-section">
            <p class="section-kicker">测试控制台</p>
            <h2>向 Agent 发送真实客服问题</h2>
            <p>页面使用本地 simulator，并展示知识来源和 LangGraph 路径。</p>
          </div>

          <div class="panel-section settings-section">
            <label for="webhookSecret">Webhook Secret</label>
            <div class="secret-field">
              <input id="webhookSecret" type="password" value="change-me" autocomplete="off" />
              <button id="toggleSecretButton" type="button" aria-label="显示或隐藏密钥">显示</button>
            </div>
            <dl class="session-info">
              <div>
                <dt>模式</dt>
                <dd>Simulator</dd>
              </div>
              <div>
                <dt>会话 ID</dt>
                <dd id="conversationId">--</dd>
              </div>
            </dl>
          </div>

          <div class="panel-section scenario-section">
            <div class="section-heading">
              <h3>快速场景</h3>
              <span>点击即发送</span>
            </div>
            <div class="scenario-list">
              <button class="scenario-card" data-message="5%传明酸怎么使用？" type="button">
                <span class="scenario-type normal">正常问答</span>
                <strong>5%传明酸怎么使用？</strong>
              </button>
              <button class="scenario-card" data-message="5%和10%传明酸有什么区别？" type="button">
                <span class="scenario-type compare">产品对比</span>
                <strong>5%和10%传明酸有什么区别？</strong>
              </button>
              <button class="scenario-card" data-message="用了之后脸很红，还有刺痛" type="button">
                <span class="scenario-type risk">风险转人工</span>
                <strong>用了之后脸很红，还有刺痛</strong>
              </button>
              <button class="scenario-card" data-message="你们老板今天穿什么颜色？" type="button">
                <span class="scenario-type unknown">未知问题</span>
                <strong>你们老板今天穿什么颜色？</strong>
              </button>
            </div>
          </div>
        </aside>

        <section class="chat-panel" aria-label="Agent 测试对话">
          <div class="chat-header">
            <div>
              <span class="live-indicator"><span></span> LANGGRAPH WORKFLOW</span>
              <h2>SounderOne 智能客服</h2>
            </div>
            <button id="toggleDebugButton" class="debug-toggle" type="button" aria-pressed="true">
              显示调试信息
            </button>
          </div>

          <div id="messageList" class="message-list" aria-live="polite">
            <article class="message-row assistant-message welcome-message">
              <div class="avatar">S1</div>
              <div class="message-content">
                <div class="message-meta"><strong>SounderOne Agent</strong><span>刚刚</span></div>
                <div class="bubble">
                  宝宝你好，这里是 Agent 测试窗口。可以输入产品用法、搭配或售后问题，并在回复下方查看检索与节点轨迹。
                </div>
              </div>
            </article>
          </div>

          <form id="messageForm" class="composer">
            <div class="composer-box">
              <textarea
                id="messageInput"
                rows="1"
                maxlength="4000"
                placeholder="输入测试问题……"
                aria-label="测试问题"
              ></textarea>
              <button id="sendButton" class="send-button" type="submit">
                <span>发送</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12h14M13 6l6 6-6 6" />
                </svg>
              </button>
            </div>
            <p class="composer-hint">Enter 发送 · Shift + Enter 换行 · 每条消息自动生成唯一 ID</p>
          </form>
        </section>
      </section>
    </main>

    <template id="loadingTemplate">
      <article class="message-row assistant-message loading-message">
        <div class="avatar">S1</div>
        <div class="message-content">
          <div class="message-meta"><strong>SounderOne Agent</strong><span>正在处理</span></div>
          <div class="bubble typing"><i></i><i></i><i></i></div>
        </div>
      </article>
    </template>

    <script src="/static/tester.js" defer></script>
  </body>
</html>
