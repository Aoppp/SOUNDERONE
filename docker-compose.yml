services:
  api:
    build: .
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin}
      PRODUCT_KNOWLEDGE_PATH: /app/knowledge/product_knowledge.json
      FAQ_KNOWLEDGE_PATH: /app/knowledge/customer_faq.json
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.48}
      KNOWLEDGE_SCORE_WINDOW: ${KNOWLEDGE_SCORE_WINDOW:-0.15}
      FAQ_MIN_SCORE: ${FAQ_MIN_SCORE:-0.72}
      PRODUCT_MIN_SCORE: ${PRODUCT_MIN_SCORE:-0.50}
      SYNTHESIS_MIN_SCORE: ${SYNTHESIS_MIN_SCORE:-0.48}
      ROUTE_CANDIDATE_MIN_SCORE: ${ROUTE_CANDIDATE_MIN_SCORE:-0.58}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: sounderone_knowledge
      RAG_REBUILD_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge:ro
    depends_on:
      - qdrant
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
